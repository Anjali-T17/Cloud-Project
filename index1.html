<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #66a4e2;
            padding: 10px 20px;
        }

        .logo img {
            width: 40px;
            height: 40px;
        }

        .links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .login {
            background-color: white;
            color: #554d4d;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            <img src="https://png.pngtree.com/png-vector/20250111/ourmid/pngtree-golden-retriever-dog-pictures-png-image_15147078.png" alt="Logo">
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <button class="login">Login</button>

    </nav>

</body>
</html>
